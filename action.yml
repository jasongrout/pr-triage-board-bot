name: 'PR Triage Board Bot'
description: 'Populate useful fields on a GitHub project board so maintainers can triage open PRs better'
author: 'Jason Grout'

inputs:
  organization:
    description: 'GitHub organization name'
    required: true
  project-number:
    description: 'GitHub Project board number'
    required: true
  gh-app-id:
    description: 'GitHub App ID for authentication'
    required: true
  gh-installation-id:
    description: 'GitHub App Installation ID for authentication'
    required: true
  repositories:
    description: 'Comma-separated list of repository names to limit querying to (optional)'
    required: false
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '23.x'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        cache: 'npm'
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      run: npm ci
      shell: bash

    - name: Build project
      run: npm run build
      shell: bash

    - name: Setup GitHub App Private Key
      run: |
        echo "$GH_APP_PRIVATE_KEY" > private-key.pem
      shell: bash
      env:
        GH_APP_PRIVATE_KEY: ${{ env.GH_APP_PRIVATE_KEY }}

    - name: Run PR Triage Bot
      run: |
        if [ -n "${{ inputs.repositories }}" ]; then
          node dist/src/main.js \
            --gh-app-id ${{ inputs.gh-app-id }} \
            --gh-installation-id ${{ inputs.gh-installation-id }} \
            --gh-app-pem-file private-key.pem \
            --repositories "${{ inputs.repositories }}" \
            ${{ inputs.organization }} ${{ inputs.project-number }}
        else
          node dist/src/main.js \
            --gh-app-id ${{ inputs.gh-app-id }} \
            --gh-installation-id ${{ inputs.gh-installation-id }} \
            --gh-app-pem-file private-key.pem \
            ${{ inputs.organization }} ${{ inputs.project-number }}
        fi
      shell: bash

    - name: Cleanup private key
      run: rm -f private-key.pem
      shell: bash
      if: ${{ always() }}

branding:
  icon: 'git-pull-request'
  color: 'blue'